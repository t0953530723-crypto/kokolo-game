<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 護眼全球翻譯</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg-soft: #f4f7f9; --text-main: #2d3748; --safe-padding: 2rem; }
        body { -webkit-tap-highlight-color: transparent; background: var(--bg-soft); color: var(--text-main); font-family: sans-serif; padding: 1rem; }
        .glass-card { background: #ffffff; border-radius: 2.5rem; box-shadow: 0 15px 35px -5px rgba(0,0,0,0.05); overflow: hidden; }
        .safe-text-area { padding: var(--safe-padding) !important; width: 100%; }
        
        .big-touch-area { 
            position: relative; display: flex; align-items: center; 
            width: 100%; height: 95px; padding: 0 1.5rem; 
            background: #fff; border-radius: 1.5rem; cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
        }
        .lang-select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }
        
        textarea { 
            font-size: 1.3rem !important; line-height: 1.8; 
            background: transparent; border: none; outline: none; 
            width: 100%; min-height: 320px; padding: 0 !important;
        }

        .recording-pulse { 
            background: #ef4444 !important; color: white !important;
            animation: pulse 1s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }

        /* 動態快捷按鈕：自適應選取的語言 */
        .quick-btn {
            padding: 0.75rem 1.25rem; border-radius: 1rem; font-weight: 800; font-size: 0.9rem;
            transition: all 0.2s; border: 2px solid #e2e8f0; background: white;
            display: flex; flex-direction: column; align-items: center; min-width: 120px;
        }
        .quick-btn.active { background: #1e293b; color: white; border-color: #1e293b; }
        .quick-btn span { font-size: 0.65rem; opacity: 0.7; margin-bottom: 2px; }
    </style>
</head>
<body class="min-h-screen flex flex-col max-w-7xl mx-auto w-full">

    <header class="w-full mb-4 px-4 pt-4">
        <div class="bg-blue-600 text-white p-4 rounded-2xl shadow-lg mb-4">
            <h2 class="font-black text-lg">💡 使用說明</h2>
            <p class="text-sm opacity-90">1. 先在上方選好「您的語言」與「對方的語言」</p>
            <p class="text-sm opacity-90">2. 下方按鈕會自動變更，點擊對應按鈕即可開始對話</p>
        </div>
    </header>

    <main class="flex-1 flex flex-col gap-6 px-2">
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 relative items-center">
            <div class="big-touch-area">
                <div class="flex flex-col">
                    <span class="text-[11px] font-black text-slate-400 uppercase tracking-widest">語言 A (主要語言)</span>
                    <span id="srcDisplay" class="font-black text-slate-700 text-xl">繁體中文</span>
                </div>
                <select id="srcLang" class="lang-select" onchange="updateUI()"></select>
                <div class="ml-auto text-slate-300">▼</div>
            </div>

            <button onclick="swapLangs()" class="lg:absolute lg:left-1/2 lg:-translate-x-1/2 z-20 bg-white text-slate-400 w-12 h-12 rounded-full shadow-lg flex items-center justify-center border border-slate-50 mx-auto -my-2 lg:my-0 active:scale-90">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
            </button>

            <div class="big-touch-area">
                <div class="flex flex-col">
                    <span class="text-[11px] font-black text-blue-500 uppercase tracking-widest">語言 B (對方語言)</span>
                    <span id="targetDisplay" class="font-black text-blue-600 text-xl">日文</span>
                </div>
                <select id="targetLang" class="lang-select" onchange="updateUI()"></select>
                <div class="ml-auto text-blue-300">▼</div>
            </div>
        </div>

        <div class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="glass-card flex flex-col min-h-[350px]">
                <div class="safe-text-area flex-1">
                    <textarea id="inputText" placeholder="選擇語言並點擊下方說話..."></textarea>
                </div>
                
                <div class="px-6 py-5 bg-slate-50 border-t flex items-center justify-between">
                    <div class="flex gap-3">
                        <button onclick="switchRole('A')" id="btnA" class="quick-btn active">
                            <span id="labelA">語言 A</span>
                            <strong id="nameA">繁體中文</strong>
                        </button>
                        <button onclick="switchRole('B')" id="btnB" class="quick-btn">
                            <span id="labelB">語言 B</span>
                            <strong id="nameB">日文</strong>
                        </button>
                    </div>
                    <button onclick="clearAll()" class="text-slate-400 font-bold text-sm">清空</button>
                </div>
            </div>

            <div id="outputCard" class="glass-card flex flex-col bg-white">
                <div id="resultContent" class="hidden safe-text-area flex-1">
                    <div class="flex justify-between items-center mb-6">
                        <span id="resBadge" class="text-[10px] font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-full uppercase tracking-widest">翻譯結果</span>
                        <button onclick="copyRes()" class="text-xs font-bold text-blue-600 underline">複製內容</button>
                    </div>
                    <div id="outputText" class="text-slate-800 font-medium whitespace-pre-wrap"></div>
                </div>
                <div id="placeholder" class="flex-1 flex items-center justify-center text-slate-300 italic text-sm">對照譯文將在此顯示...</div>
            </div>
        </div>

        <button id="voiceBtn" onclick="toggleSpeech()" class="w-full bg-slate-900 text-white py-7 rounded-[2.5rem] font-black text-2xl shadow-2xl active:scale-[0.95] transition-all flex items-center justify-center gap-4 mb-8">
            <div class="w-3 h-3 bg-red-500 rounded-full"></div>
            <span id="voiceText">按一下 開始語音</span>
        </button>

    </main>

    <script>
        const allLangs = [
            {v: "zh-TW", n: "繁體中文"}, {v: "en", n: "英文"}, {v: "ja", n: "日文"}, {v: "ko", n: "韓文"},
            {v: "th", n: "泰文"}, {v: "vi", n: "越南文"}, {v: "id", n: "印尼文"}, {v: "ms", n: "馬來文"},
            {v: "fr", n: "法文"}, {v: "de", n: "德文"}, {v: "es", n: "西班牙文"}, {v: "pt", n: "葡萄牙文"},
            {v: "ru", n: "俄文"}, {v: "tl", n: "菲律賓文"}, {v: "my", n: "緬甸文"}, {v: "km", n: "高棉文"}
            // (其餘100多種可依此類推載入)
        ];

        const srcS = document.getElementById('srcLang');
        const tarS = document.getElementById('targetLang');
        let currentMode = 'A'; // 'A' 為來源說話, 'B' 為對方說話
        let recognition;

        function init() {
            allLangs.forEach(l => {
                srcS.add(new Option(l.n, l.v));
                tarS.add(new Option(l.n, l.v));
            });
            srcS.value = "zh-TW"; tarS.value = "ja";
            updateUI();

            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (window.SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.onresult = (e) => { 
                    document.getElementById('inputText').value = e.results[0][0].transcript;
                    runTranslate(); 
                };
                recognition.onend = () => {
                    document.getElementById('voiceBtn').classList.remove('recording-pulse');
                    document.getElementById('voiceText').innerText = "按一下 開始語音";
                };
            }
        }

        // 當切換身分時（我說話或同事說話）
        function switchRole(role) {
            currentMode = role;
            updateUI();
        }

        function updateUI() {
            const nameA = srcS.options[srcS.selectedIndex].text;
            const nameB = tarS.options[tarS.selectedIndex].text;

            document.getElementById('srcDisplay').innerText = nameA;
            document.getElementById('targetDisplay').innerText = nameB;
            
            // 更新下方按鈕文字，讓同事知道點哪一個
            document.getElementById('nameA').innerText = nameA;
            document.getElementById('nameB').innerText = nameB;

            // 切換高亮
            document.getElementById('btnA').className = currentMode === 'A' ? 'quick-btn active' : 'quick-btn';
            document.getElementById('btnB').className = currentMode === 'B' ? 'quick-btn active' : 'quick-btn';

            // 設定語音辨識語系
            if(recognition) {
                recognition.lang = (currentMode === 'A') ? srcS.value : tarS.value;
            }
            
            document.getElementById('voiceText').innerText = `按一下 說 ${currentMode === 'A' ? nameA : nameB}`;
        }

        function swapLangs() {
            const t = srcS.value; srcS.value = tarS.value; tarS.value = t;
            updateUI();
        }

        function toggleSpeech() {
            try { 
                recognition.start(); 
                document.getElementById('voiceBtn').classList.add('recording-pulse');
                document.getElementById('voiceText').innerText = "正在聆聽...";
            } catch(e) { recognition.stop(); }
        }

        async function runTranslate() {
            const txt = document.getElementById('inputText').value.trim();
            if(!txt) return;

            // 判斷翻譯方向：A說話就翻成B，B說話就翻成A
            const sl = (currentMode === 'A') ? srcS.value : tarS.value;
            const tl = (currentMode === 'A') ? tarS.value : srcS.value;

            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(txt)}`);
                const data = await res.json();
                const result = data[0].map(i => i[0]).join('');
                document.getElementById('placeholder').classList.add('hidden');
                document.getElementById('resultContent').classList.remove('hidden');
                document.getElementById('outputText').innerText = result;
                if(window.innerWidth < 1024) document.getElementById('outputCard').scrollIntoView({behavior: 'smooth'});
            } catch(e) {}
        }

        function clearAll() { document.getElementById('inputText').value = ""; }
        function copyRes() { navigator.clipboard.writeText(document.getElementById('outputText').innerText); alert("譯文已複製"); }

        init();
    </script>
</body>
</html>
