<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高精準對照翻譯</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        textarea { font-size: 16px !important; }
        /* 自定義捲軸 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#f8f9fa] min-h-screen flex flex-col">

    <nav class="bg-white border-b px-4 py-3 sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">文</div>
            <span class="font-medium text-gray-700">對照翻譯</span>
        </div>
        <div id="status" class="text-[10px] text-gray-400 font-mono uppercase tracking-tighter">Engine: Standby</div>
    </nav>

    <main class="flex-1 flex flex-col p-4 max-w-6xl mx-auto w-full gap-4">
        
        <div class="flex items-center bg-white rounded-xl shadow-sm border p-1">
            <div class="flex-1 text-center py-2 text-sm font-bold text-blue-600">自動偵測</div>
            <div class="px-2 text-gray-300">⇄</div>
            <select id="targetLang" class="flex-1 py-2 bg-transparent outline-none text-sm font-bold text-center appearance-none cursor-pointer">
                <option value="ZH">繁體中文</option>
                <option value="EN">英文 (EN)</option>
                <option value="JA">日文 (JA)</option>
                <option value="KO">韓文 (KO)</option>
            </select>
        </div>

        <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col">
                <textarea id="inputText" class="flex-1 p-5 outline-none resize-none text-gray-800 leading-relaxed rounded-2xl" placeholder="請輸入文字..."></textarea>
                <div class="p-3 border-t flex justify-between items-center bg-gray-50/50 rounded-b-2xl">
                    <span id="charCount" class="text-[10px] text-gray-400">0 字</span>
                    <button onclick="clearAll()" class="text-xs text-gray-400 hover:text-red-500">清除內容</button>
                </div>
            </div>

            <div id="outputContainer" class="bg-white rounded-2xl shadow-sm border border-blue-100 flex flex-col transition-all">
                <div id="placeholder" class="flex-1 flex flex-col items-center justify-center text-gray-300 p-10 text-center">
                    <svg class="w-12 h-12 mb-2 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5c1.383 4.512 3.533 9.043 7.17 11.851"></path></svg>
                    <p class="text-sm">翻譯結果將顯示在此</p>
                </div>
                
                <div id="resultContent" class="hidden flex-1 flex flex-col p-5">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-[10px] font-bold text-blue-500 bg-blue-50 px-2 py-1 rounded">翻譯結果</span>
                        <button onclick="copyResult()" class="text-xs text-blue-600 font-medium active:scale-90 transition-transform">複製譯文</button>
                    </div>
                    <div id="outputText" class="flex-1 text-gray-800 leading-relaxed text-lg whitespace-pre-wrap"></div>
                    <div class="mt-4 pt-4 border-t border-dashed border-gray-100">
                        <p class="text-[10px] text-gray-400 mb-1 font-bold uppercase">原文對照</p>
                        <p id="originalRef" class="text-xs text-gray-400 line-clamp-3 italic"></p>
                    </div>
                </div>
            </div>
        </div>

        <button id="transBtn" onclick="runTranslation()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold text-lg shadow-lg shadow-blue-100 transition-all active:scale-[0.98] sticky bottom-4">
            立即翻譯
        </button>

    </main>

    <script>
        // 1. API 配置
        const DEEPL_KEY = "YOUR_DEEPL_KEY"; 

        // 2. 自動監聽字數
        const inputField = document.getElementById('inputText');
        inputField.addEventListener('input', () => {
            document.getElementById('charCount').innerText = `${inputField.value.length} 字`;
        });

        // 3. 核心翻譯流程
        async function runTranslation() {
            const text = inputField.value.trim();
            const target = document.getElementById('targetLang').value;
            const btn = document.getElementById('transBtn');
            const status = document.getElementById('status');

            if (!text) return;

            // UI 鎖定
            btn.disabled = true;
            btn.innerText = "正在取得翻譯...";
            status.innerText = "Engine: Processing";
            status.className = "text-[10px] text-blue-500 font-mono animate-pulse";

            try {
                // 第一層：DeepL
                const res = await fetch(`https://api-free.deepl.com/v2/translate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams({ auth_key: DEEPL_KEY, text: text, target_lang: target })
                });
                if (!res.ok) throw new Error();
                const data = await res.json();
                display(data.translations[0].text, text, "DeepL High-Precision");
            } catch (e) {
                // 第二層：Google Web
                const gMap = { 'ZH': 'zh-TW', 'EN': 'en', 'JA': 'ja', 'KO': 'ko' };
                const gCode = gMap[target] || 'zh-TW';
                const gUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${gCode}&dt=t&q=${encodeURIComponent(text)}`;
                
                try {
                    const gRes = await fetch(gUrl);
                    const gData = await gRes.json();
                    const gText = gData[0].map(item => item[0]).join('');
                    display(gText, text, "Google Standard");
                } catch (err) {
                    alert("翻譯暫時中斷，請稍後再試");
                }
            } finally {
                btn.disabled = false;
                btn.innerText = "立即翻譯";
            }
        }

        // 4. 顯示結果 (對照佈局)
        function display(translated, original, engine) {
            document.getElementById('placeholder').classList.add('hidden');
            document.getElementById('resultContent').classList.remove('hidden');
            document.getElementById('outputText').innerText = translated;
            document.getElementById('originalRef').innerText = original;
            document.getElementById('status').innerText = `Engine: ${engine}`;
            document.getElementById('status').className = "text-[10px] text-green-500 font-mono";
            
            // 手機端自動滾動到結果區
            if (window.innerWidth < 768) {
                document.getElementById('outputContainer').scrollIntoView({ behavior: 'smooth' });
            }
        }

        function clearAll() {
            inputField.value = "";
            document.getElementById('resultContent').classList.add('hidden');
            document.getElementById('placeholder').classList.remove('hidden');
            document.getElementById('charCount').innerText = "0 字";
        }

        function copyResult() {
            const text = document.getElementById('outputText').innerText;
            navigator.clipboard.writeText(text).then(() => alert("已複製譯文"));
        }
    </script>
</body>
</html>
