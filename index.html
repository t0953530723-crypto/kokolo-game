<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 專業對照翻譯</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .active-ring:focus-within { ring: 2px; ring-color: #2563eb; }
        textarea { font-size: 16px !important; }
    </style>
</head>
<body class="bg-[#f8f9fa] min-h-screen flex flex-col font-sans">

    <header class="bg-white border-b px-4 py-3 sticky top-0 z-50 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5c1.383 4.512 3.533 9.043 7.17 11.851"></path></svg>
            <span class="font-bold text-gray-700 tracking-tight">AI 翻譯對照</span>
        </div>
        <div id="status" class="text-[10px] font-bold text-gray-400 border border-gray-200 px-2 py-1 rounded">READY</div>
    </header>

    <main class="flex-1 p-4 max-w-7xl mx-auto w-full flex flex-col gap-4">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-px bg-gray-200 rounded-xl overflow-hidden shadow-sm border border-gray-200">
            <div class="bg-white p-2 flex items-center justify-center">
                <select id="srcLang" class="w-full text-center bg-transparent font-bold text-gray-600 outline-none text-sm cursor-pointer">
                    <option value="auto">自動偵測語言</option>
                    <option value="zh-TW" selected>繁體中文</option>
                    <option value="en">英文</option>
                    <option value="ja">日文</option>
                    <option value="ko">韓文</option>
                </select>
            </div>
            <div class="bg-white p-2 flex items-center justify-center border-t md:border-t-0 md:border-l border-gray-100">
                <select id="targetLang" class="w-full text-center bg-transparent font-bold text-blue-600 outline-none text-sm cursor-pointer">
                    <option value="zh-TW" selected>繁體中文</option>
                    <option value="en">英文</option>
                    <option value="ja">日文</option>
                    <option value="ko">韓文</option>
                    <option value="fr">法文</option>
                    <option value="de">德文</option>
                    <option value="th">泰文</option>
                    <option value="vi">越南文</option>
                </select>
            </div>
        </div>

        <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4">
            
            <div id="dropZone" class="bg-white rounded-2xl shadow-sm border border-gray-200 flex flex-col relative transition-all">
                <textarea id="inputText" class="flex-1 p-5 outline-none resize-none text-gray-800 leading-relaxed bg-transparent rounded-t-2xl min-h-[250px]" placeholder="輸入文字或拖曳圖片..."></textarea>
                
                <div id="ocrLoader" class="hidden absolute inset-0 bg-white/90 z-10 flex flex-col items-center justify-center space-y-2">
                    <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-xs font-bold text-blue-600">辨識圖片中...</p>
                </div>

                <div class="p-3 bg-gray-50 flex justify-between items-center rounded-b-2xl border-t border-gray-100">
                    <div class="flex gap-2">
                        <label for="fileInput" class="p-2 hover:bg-gray-200 rounded-lg cursor-pointer transition-colors" title="上傳圖片">
                            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        </label>
                        <input type="file" id="fileInput" class="hidden" accept="image/*">
                    </div>
                    <button onclick="clearAll()" class="text-xs font-bold text-gray-400 hover:text-red-500 px-3 py-1">清除</button>
                </div>
            </div>

            <div id="outputContainer" class="bg-white rounded-2xl shadow-sm border border-blue-100 flex flex-col relative min-h-[250px]">
                <div id="placeholder" class="flex-1 flex flex-col items-center justify-center text-gray-300 p-10">
                    <p class="text-sm font-medium">翻譯結果將顯示在此</p>
                </div>
                
                <div id="resultContent" class="hidden flex-1 flex flex-col p-6 overflow-y-auto">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-[10px] font-black text-blue-500 uppercase tracking-widest">Translation</span>
                        <button onclick="copyResult()" class="text-xs font-bold text-blue-600 hover:underline">複製內容</button>
                    </div>
                    <div id="outputText" class="flex-1 text-gray-800 text-lg leading-relaxed whitespace-pre-wrap"></div>
                </div>

                <div id="transLoader" class="hidden absolute inset-0 bg-white/60 backdrop-blur-[2px] z-10 flex items-center justify-center">
                    <div class="w-6 h-6 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                </div>
            </div>
        </div>

        <button id="transBtn" onclick="handleTranslate()" class="w-full bg-blue-600 active:bg-blue-800 text-white py-5 rounded-2xl font-black text-lg shadow-xl shadow-blue-100 transition-all active:scale-[0.98]">
            立即翻譯
        </button>

    </main>

    <script>
        const inputField = document.getElementById('inputText');
        const fileInput = document.getElementById('fileInput');
        const ocrLoader = document.getElementById('ocrLoader');
        const transLoader = document.getElementById('transLoader');
        const status = document.getElementById('status');

        // 1. 拖曳上傳支援
        const dropZone = document.getElementById('dropZone');
        ['dragenter', 'dragover'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.add('ring-2', 'ring-blue-400'), false));
        ['dragleave', 'drop'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.remove('ring-2', 'ring-blue-400'), false));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if(file && file.type.startsWith('image/')) processOCR(file);
        });

        fileInput.addEventListener('change', (e) => processOCR(e.target.files[0]));

        // 2. OCR 處理
        async function processOCR(file) {
            if (!file) return;
            ocrLoader.classList.remove('hidden');
            status.innerText = "OCR PROCESSING";
            try {
                const worker = await Tesseract.createWorker('chi_tra+chi_sim+eng+jpn');
                const { data: { text } } = await worker.recognize(file);
                await worker.terminate();
                inputField.value = text;
            } catch (err) {
                alert("圖片辨識失敗");
            } finally {
                ocrLoader.classList.add('hidden');
                status.innerText = "READY";
            }
        }

        // 3. 翻譯邏輯
        async function handleTranslate() {
            const text = inputField.value.trim();
            const sl = document.getElementById('srcLang').value;
            const tl = document.getElementById('targetLang').value;
            const btn = document.getElementById('transBtn');

            if (!text) return;

            btn.disabled = true;
            transLoader.classList.remove('hidden');
            status.innerText = "TRANSLATING";

            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                const data = await res.json();
                
                const result = data[0].map(item => item[0]).join('');
                
                document.getElementById('placeholder').classList.add('hidden');
                document.getElementById('resultContent').classList.remove('hidden');
                document.getElementById('outputText').innerText = result;
                status.innerText = "SUCCESS";
            } catch (err) {
                alert("翻譯暫時不可用");
                status.innerText = "ERROR";
            } finally {
                btn.disabled = false;
                transLoader.classList.add('hidden');
            }
        }

        function clearAll() {
            inputField.value = "";
            document.getElementById('resultContent').classList.add('hidden');
            document.getElementById('placeholder').classList.remove('hidden');
        }

        function copyResult() {
            navigator.clipboard.writeText(document.getElementById('outputText').innerText);
            alert("已複製翻譯結果");
        }
    </script>
</body>
</html>
