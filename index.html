<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 全球翻譯 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg-soft: #f4f7f9; --text-main: #2d3748; --safe-padding: 2rem; }
        body { -webkit-tap-highlight-color: transparent; background: var(--bg-soft); color: var(--text-main); font-family: sans-serif; padding: 1rem; }
        .glass-card { background: #ffffff; border-radius: 2.5rem; box-shadow: 0 15px 35px -5px rgba(0,0,0,0.05); overflow: hidden; }
        .safe-text-area { padding: var(--safe-padding) !important; width: 100%; }
        .big-touch-area { position: relative; display: flex; align-items: center; width: 100%; height: 95px; padding: 0 1.5rem; background: #fff; border-radius: 1.5rem; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); }
        textarea { font-size: 1.3rem !important; line-height: 1.8; background: transparent; border: none; outline: none; width: 100%; min-height: 300px; padding: 0 !important; }
        .recording-pulse { background: #ef4444 !important; color: white !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
        .quick-btn { padding: 0.75rem 1rem; border-radius: 1rem; font-weight: 800; font-size: 0.9rem; transition: all 0.2s; border: 2px solid #e2e8f0; background: white; display: flex; flex-direction: column; align-items: center; min-width: 110px; }
        .quick-btn.active { background: #1e293b; color: white; border-color: #1e293b; }
        
        #searchModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 100; padding: 1.5rem; }
        .search-container { background: white; border-radius: 2rem; max-width: 500px; margin: 0 auto; height: 80vh; display: flex; flex-direction: column; overflow: hidden; }
        #langSearchInput { width: 100%; padding: 1.5rem; font-size: 1.1rem; border: none; border-bottom: 1px solid #eee; outline: none; font-weight: bold; }
        .lang-list { flex: 1; overflow-y: auto; padding: 1rem; }
        .lang-item { padding: 1rem 1.5rem; border-radius: 1rem; margin-bottom: 0.5rem; cursor: pointer; transition: background 0.2s; font-weight: 600; display: flex; justify-content: space-between; }
        .lang-item:active { background: #f0f4f8; }
    </style>
</head>
<body class="min-h-screen flex flex-col max-w-7xl mx-auto w-full">

    <header class="w-full mb-4 px-4 pt-4">
        <div class="bg-slate-900 text-white p-6 rounded-[2rem] shadow-xl mb-4">
            <h2 class="font-black text-xl mb-3 flex items-center gap-2 text-blue-400">
                <span>🌐</span> 全能翻譯指引
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-2">
                    <p class="text-[13px] font-bold text-slate-300 underline decoration-blue-500 underline-offset-4 mb-2">使用方法</p>
                    <p class="text-xs opacity-90 flex items-start gap-2"><span>1. 點擊</span><b>國家名稱</b><span>可快速搜索全球語系。</span></p>
                    <p class="text-xs opacity-90 flex items-start gap-2"><span>2. 直接輸入文字並點擊</span><b>「翻譯文字」</b><span>鈕。</span></p>
                </div>
                <div class="space-y-2 border-t md:border-t-0 md:border-l border-slate-700 pt-3 md:pt-0 md:pl-4">
                    <p class="text-[13px] font-bold text-slate-300 underline decoration-blue-500 underline-offset-4 mb-2">語音對話</p>
                    <p class="text-xs opacity-90 flex items-start gap-2"><span>A. 點擊下方身份按鈕，切換誰在說話。</span></p>
                    <p class="text-xs opacity-90 flex items-start gap-2"><span>B. 按住底部</span><b>「大鈕」</b><span>進行錄音。</span></p>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col gap-6 px-2">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 relative items-center">
            <div class="big-touch-area" onclick="openSearch('src')">
                <div class="flex flex-col">
                    <span class="text-[11px] font-black text-slate-400 uppercase tracking-widest">您的語言 (A)</span>
                    <span id="srcDisplay" class="font-black text-slate-700 text-xl">繁體中文</span>
                </div>
                <div class="ml-auto text-slate-300">🔍</div>
            </div>
            <button onclick="swapLangs()" class="lg:absolute lg:left-1/2 lg:-translate-x-1/2 z-20 bg-white text-slate-400 w-12 h-12 rounded-full shadow-lg flex items-center justify-center border border-slate-50 mx-auto -my-2 active:scale-90">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
            </button>
            <div class="big-touch-area" onclick="openSearch('target')">
                <div class="flex flex-col">
                    <span class="text-[11px] font-black text-blue-500 uppercase tracking-widest">同事語言 (B)</span>
                    <span id="targetDisplay" class="font-black text-blue-600 text-xl">越南文</span>
                </div>
                <div class="ml-auto text-blue-300">🔍</div>
            </div>
        </div>

        <div class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="glass-card flex flex-col min-h-[350px]">
                <div class="safe-text-area flex-1">
                    <textarea id="inputText" placeholder="點擊錄音，或直接在此輸入文字..."></textarea>
                </div>
                <div class="px-6 py-5 bg-slate-50 border-t flex items-center justify-between gap-2 overflow-x-auto">
                    <div class="flex gap-2">
                        <button onclick="switchRole('A')" id="btnA" class="quick-btn active">
                            <span>我說</span><strong id="nameA">繁體中文</strong>
                        </button>
                        <button onclick="switchRole('B')" id="btnB" class="quick-btn">
                            <span>同事說</span><strong id="nameB">越南文</strong>
                        </button>
                    </div>
                    <div class="flex gap-2 shrink-0">
                        <button onclick="runTranslate()" class="bg-blue-600 text-white px-4 py-3 rounded-xl font-black text-sm shadow-md active:scale-95">翻譯文字</button>
                        <button onclick="clearAll()" class="text-slate-400 font-bold text-sm px-2">清空</button>
                    </div>
                </div>
            </div>
            <div id="outputCard" class="glass-card flex flex-col bg-white">
                <div id="resultContent" class="hidden safe-text-area flex-1">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-[10px] font-black text-blue-600 bg-blue-50 px-3 py-1 rounded-full uppercase">對照譯文</span>
                        <button onclick="copyRes()" class="text-xs font-bold text-blue-600 underline">複製</button>
                    </div>
                    <div id="outputText" class="text-slate-800 font-medium whitespace-pre-wrap"></div>
                </div>
                <div id="placeholder" class="flex-1 flex items-center justify-center text-slate-300 italic text-sm">等待輸入或語音...</div>
            </div>
        </div>

        <button id="voiceBtn" onclick="toggleSpeech()" class="w-full bg-slate-900 text-white py-7 rounded-[2.5rem] font-black text-2xl shadow-2xl active:scale-[0.95] flex items-center justify-center gap-4 mb-8">
            <div class="w-3 h-3 bg-red-500 rounded-full"></div>
            <span id="voiceText">按一下 開始語音</span>
        </button>
    </main>

    <div id="searchModal" onclick="closeSearch(event)">
        <div class="search-container" onclick="event.stopPropagation()">
            <input type="text" id="langSearchInput" placeholder="搜索國家名稱..." oninput="filterLangs()">
            <div class="lang-list" id="langListContainer"></div>
        </div>
    </div>

    <script>
        const allLangs = [
            {v: "zh-TW", n: "繁體中文"}, {v: "zh-CN", n: "簡體中文"}, {v: "en", n: "英文"}, {v: "ja", n: "日文"}, 
            {v: "ko", n: "韓文"}, {v: "th", n: "泰文"}, {v: "vi", n: "越南文"}, {v: "id", n: "印尼文"}, 
            {v: "ms", n: "馬來文"}, {v: "hi", n: "印地文"}, {v: "ar", n: "阿拉伯文"}, {v: "fr", n: "法文"}, 
            {v: "de", n: "德文"}, {v: "es", n: "西班牙文"}, {v: "pt", n: "葡萄牙文"}, {v: "ru", n: "俄文"}, 
            {v: "tl", n: "菲律賓文"}, {v: "my", n: "緬甸文"}, {v: "km", n: "高棉文"}, {v: "lo", n: "寮國文"},
            {v: "bn", n: "孟加拉文"}, {v: "tr", n: "土耳其文"}, {v: "nl", n: "荷蘭文"}, {v: "it", n: "義大利文"},
            {v: "pl", n: "波蘭文"}, {v: "uk", n: "烏克蘭文"}, {v: "af", n: "南非文"}, {v: "sq", n: "阿爾巴尼亞文"},
            {v: "am", n: "阿姆哈拉文"}, {v: "hy", n: "亞美尼亞文"}, {v: "az", n: "亞塞拜然文"}, {v: "be", n: "白俄羅斯文"},
            {v: "bs", n: "波士尼亞文"}, {v: "bg", n: "保加利亞文"}, {v: "ca", n: "加泰羅尼亞文"}, {v: "hr", n: "克羅埃西亞文"},
            {v: "cs", n: "捷克文"}, {v: "da", n: "丹麥文"}, {v: "et", n: "愛沙尼亞文"}, {v: "fi", n: "芬蘭文"},
            {v: "ka", n: "喬治亞文"}, {v: "el", n: "希臘文"}, {v: "gu", n: "古吉拉特文"}, {v: "he", n: "希伯來文"},
            {v: "hu", n: "匈牙利文"}, {v: "is", n: "冰島文"}, {v: "kn", n: "坎那達文"}, {v: "kk", n: "哈薩克文"},
            {v: "ky", n: "吉爾吉斯文"}, {v: "lv", n: "拉脫維亞文"}, {v: "lt", n: "立陶宛文"}, {v: "mk", n: "馬其頓文"},
            {v: "ml", n: "馬拉雅拉姆文"}, {v: "mn", n: "蒙古文"}, {v: "ne", n: "尼泊爾文"}, {v: "no", n: "挪威文"},
            {v: "ps", n: "普什圖文"}, {v: "fa", n: "波斯文"}, {v: "pa", n: "旁遮普文"}, {v: "ro", n: "羅馬尼亞文"},
            {v: "sr", n: "塞爾維亞文"}, {v: "sk", n: "斯洛伐克文"}, {v: "sl", n: "斯洛維尼亞文"}, {v: "sw", n: "斯瓦希里文"},
            {v: "sv", n: "瑞典文"}, {v: "ta", n: "坦米爾文"}, {v: "te", n: "泰盧固文"}, {v: "ur", n: "烏爾都文"},
            {v: "uz", n: "烏茲別克文"}, {v: "cy", n: "威爾斯文"}, {v: "zu", n: "祖魯文"}
        ].sort((a,b) => a.n.localeCompare(b.n, 'zh-TW'));

        let selectedSrc = "zh-TW", selectedTarget = "vi", activeTarget = 'src', currentRole = 'A', recognition;

        function openSearch(type) { activeTarget = type; document.getElementById('searchModal').style.display = 'block'; filterLangs(); }
        function closeSearch() { document.getElementById('searchModal').style.display = 'none'; }
        function filterLangs() {
            const kw = document.getElementById('langSearchInput').value.toLowerCase();
            const container = document.getElementById('langListContainer');
            container.innerHTML = '';
            allLangs.filter(l => l.n.includes(kw) || l.v.includes(kw)).forEach(l => {
                const div = document.createElement('div');
                div.className = 'lang-item'; div.innerHTML = `${l.n} <span class="text-slate-300 text-xs">${l.v}</span>`;
                div.onclick = () => { if(activeTarget === 'src') selectedSrc = l.v; else selectedTarget = l.v; updateUI(); closeSearch(); };
                container.appendChild(div);
            });
        }

        function updateUI() {
            const nA = allLangs.find(l => l.v === selectedSrc).n;
            const nB = allLangs.find(l => l.v === selectedTarget).n;
            document.getElementById('srcDisplay').innerText = nA; document.getElementById('targetDisplay').innerText = nB;
            document.getElementById('nameA').innerText = nA; document.getElementById('nameB').innerText = nB;
            document.getElementById('btnA').className = currentRole === 'A' ? 'quick-btn active' : 'quick-btn';
            document.getElementById('btnB').className = currentRole === 'B' ? 'quick-btn active' : 'quick-btn';
            if(recognition) recognition.lang = currentRole === 'A' ? selectedSrc : selectedTarget;
            document.getElementById('voiceText').innerText = `按一下 說${currentRole === 'A' ? nA : nB}`;
        }

        function switchRole(role) { currentRole = role; updateUI(); }
        function swapLangs() { const t = selectedSrc; selectedSrc = selectedTarget; selectedTarget = t; updateUI(); }

        window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (window.SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.onresult = (e) => { document.getElementById('inputText').value = e.results[0][0].transcript; runTranslate(); };
            recognition.onend = () => document.getElementById('voiceBtn').classList.remove('recording-pulse');
        }

        function toggleSpeech() { try { recognition.start(); document.getElementById('voiceBtn').classList.add('recording-pulse'); } catch(e) { recognition.stop(); } }

        async function runTranslate() {
            const txt = document.getElementById('inputText').value.trim();
            if(!txt) return;
            const sl = currentRole === 'A' ? selectedSrc : selectedTarget;
            const tl = currentRole === 'A' ? selectedTarget : selectedSrc;
            const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(txt)}`);
            const data = await res.json();
            document.getElementById('placeholder').classList.add('hidden');
            document.getElementById('resultContent').classList.remove('hidden');
            document.getElementById('outputText').innerText = data[0].map(i => i[0]).join('');
        }

        function clearAll() { document.getElementById('inputText').value = ""; }
        function copyRes() { navigator.clipboard.writeText(document.getElementById('outputText').innerText); alert("已複製"); }
        updateUI();
    </script>
</body>
</html>
