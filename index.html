<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 護眼全球翻譯</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --bg-soft: #f4f7f9; --text-main: #2d3748; --safe-padding: 2rem; }
        body { -webkit-tap-highlight-color: transparent; background: var(--bg-soft); color: var(--text-main); font-family: sans-serif; padding: 1rem; }
        .glass-card { background: #ffffff; border-radius: 2.5rem; box-shadow: 0 15px 35px -5px rgba(0,0,0,0.05); overflow: hidden; }
        .safe-text-area { padding: var(--safe-padding) !important; width: 100%; }
        
        .big-touch-area { 
            position: relative; display: flex; align-items: center; 
            width: 100%; height: 90px; padding: 0 1.5rem; 
            background: #fff; border-radius: 1.5rem; cursor: pointer;
            border: 2px solid transparent; transition: all 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
        }
        .lang-select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }
        
        textarea { 
            font-size: 1.3rem !important; line-height: 1.8; 
            background: transparent; border: none; outline: none; 
            width: 100%; min-height: 320px; padding: 0 !important;
        }

        .recording-pulse { 
            background: #ef4444 !important; color: white !important;
            animation: pulse 1s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }

        /* 快捷按鈕 */
        .quick-btn {
            padding: 0.75rem 1rem; border-radius: 1rem; font-weight: 800; font-size: 0.85rem;
            transition: all 0.2s; border: 2px solid #e2e8f0; background: white;
        }
        .quick-btn.active { background: #1e293b; color: white; border-color: #1e293b; }
    </style>
</head>
<body class="min-h-screen flex flex-col max-w-7xl mx-auto w-full">

    <header class="w-full mb-6 flex justify-between items-center px-4 pt-4">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-xl shadow-blue-100">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5c1.383 4.512 3.533 9.043 7.17 11.851"></path></svg>
            </div>
            <h1 class="text-2xl font-black text-slate-800 tracking-tighter">全球通翻譯 Pro</h1>
        </div>
    </header>

    <main class="flex-1 flex flex-col gap-6 px-2">
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 relative items-center">
            <div class="big-touch-area">
                <div class="flex flex-col">
                    <span class="text-[11px] font-black text-slate-400 uppercase tracking-widest">現在是誰在說話？</span>
                    <span id="srcDisplay" class="font-black text-slate-700 text-xl">繁體中文</span>
                </div>
                <select id="srcLang" class="lang-select" onchange="updateUI()"></select>
                <div class="ml-auto text-slate-300">▼</div>
            </div>

            <button onclick="swapLangs()" class="lg:absolute lg:left-1/2 lg:-translate-x-1/2 z-20 bg-white text-slate-400 w-12 h-12 rounded-full shadow-lg flex items-center justify-center border border-slate-50 mx-auto -my-2 lg:my-0 active:scale-90">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
            </button>

            <div class="big-touch-area">
                <div class="flex flex-col">
                    <span class="text-[11px] font-black text-blue-500 uppercase tracking-widest">想翻譯成哪國語言？</span>
                    <span id="targetDisplay" class="font-black text-blue-600 text-xl">日文</span>
                </div>
                <select id="targetLang" class="lang-select" onchange="updateUI()"></select>
                <div class="ml-auto text-blue-300">▼</div>
            </div>
        </div>

        <div class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="glass-card flex flex-col min-h-[350px]">
                <div class="safe-text-area flex-1">
                    <textarea id="inputText" placeholder="點擊下方按鈕開始說話..."></textarea>
                </div>
                <div class="px-6 py-4 bg-slate-50 border-t flex items-center justify-between">
                    <div class="flex gap-2">
                        <button onclick="quickSet('zh-TW')" id="qZH" class="quick-btn active">我說中文</button>
                        <button onclick="quickSet('ja')" id="qJA" class="quick-btn">日本同事</button>
                    </div>
                    <button onclick="clearAll()" class="text-slate-400 font-bold text-sm">清空</button>
                </div>
            </div>

            <div id="outputCard" class="glass-card flex flex-col bg-white">
                <div id="resultContent" class="hidden safe-text-area flex-1">
                    <div class="flex justify-between items-center mb-6 text-blue-600 font-black">
                        <span class="text-[10px] bg-blue-50 px-3 py-1 rounded-full uppercase">翻譯內容 (對照)</span>
                        <button onclick="copyRes()" class="text-xs">複製結果</button>
                    </div>
                    <div id="outputText" class="text-slate-800 font-medium whitespace-pre-wrap"></div>
                </div>
                <div id="placeholder" class="flex-1 flex items-center justify-center text-slate-300 italic text-sm">等待對話翻譯中...</div>
            </div>
        </div>

        <button id="voiceBtn" onclick="toggleSpeech()" class="w-full bg-slate-900 text-white py-6 rounded-[2.5rem] font-black text-2xl shadow-2xl active:scale-[0.98] transition-all flex items-center justify-center gap-4 mb-8">
            <div class="w-3 h-3 bg-red-500 rounded-full"></div>
            <span id="voiceText">按一下 開始語音</span>
        </button>

    </main>

    <script>
        // Google 翻譯完整支援語言清單 (100+)
        const allLangs = [
            {v: "zh-TW", n: "繁體中文"}, {v: "zh-CN", n: "簡體中文"}, {v: "en", n: "英文 (English)"},
            {v: "ja", n: "日文 (Japanese)"}, {v: "ko", n: "韓文 (Korean)"}, {v: "fr", n: "法文 (French)"},
            {v: "de", n: "德文 (German)"}, {v: "it", n: "義大利文 (Italian)"}, {v: "es", n: "西班牙文 (Spanish)"},
            {v: "pt", n: "葡萄牙文 (Portuguese)"}, {v: "ru", n: "俄文 (Russian)"}, {v: "vi", n: "越南文 (Vietnamese)"},
            {v: "th", n: "泰文 (Thai)"}, {v: "ms", n: "馬來文 (Malay)"}, {v: "id", n: "印尼文 (Indonesian)"},
            {v: "hi", n: "印地文 (Hindi)"}, {v: "ar", n: "阿拉伯文 (Arabic)"}, {v: "tr", n: "土耳其文 (Turkish)"},
            {v: "nl", n: "荷蘭文 (Dutch)"}, {v: "pl", n: "波蘭文 (Polish)"}, {v: "sv", n: "瑞典文 (Swedish)"},
            {v: "da", n: "丹麥文 (Danish)"}, {v: "fi", n: "芬蘭文 (Finnish)"}, {v: "no", n: "挪威文 (Norwegian)"},
            {v: "cs", n: "捷克文 (Czech)"}, {v: "el", n: "希臘文 (Greek)"}, {v: "hu", n: "匈牙利文 (Hungarian)"},
            {v: "ro", n: "羅馬尼亞文 (Romanian)"}, {v: "uk", n: "烏克蘭文 (Ukrainian)"}, {v: "he", n: "希伯來文 (Hebrew)"},
            {v: "tl", n: "菲律賓文 (Tagalog)"}, {v: "my", n: "緬甸文 (Burmese)"}, {v: "km", n: "高棉文 (Khmer)"},
            {v: "lo", n: "寮國文 (Lao)"}, {v: "bn", n: "孟加拉文 (Bengali)"}, {v: "pa", n: "旁遮普文 (Punjabi)"},
            {v: "af", n: "南非荷蘭文"}, {v: "sq", n: "阿爾巴尼亞文"}, {v: "am", n: "阿姆哈拉文"}, {v: "hy", n: "亞美尼亞文"},
            {v: "az", n: "亞塞拜然文"}, {v: "eu", n: "巴斯克文"}, {v: "be", n: "白俄羅斯文"}, {v: "bs", n: "波士尼亞文"},
            {v: "bg", n: "保加利亞文"}, {v: "ca", n: "加泰羅尼亞文"}, {v: "ceb", n: "宿霧文"}, {v: "ny", n: "齊切瓦文"},
            {v: "co", n: "科西嘉文"}, {v: "hr", n: "克羅埃西亞文"}, {v: "eo", n: "世界語"}, {v: "et", n: "愛沙尼亞文"},
            {v: "gl", n: "加利西亞文"}, {v: "ka", n: "喬治亞文"}, {v: "gu", n: "古吉拉特文"}, {v: "ht", n: "海地克里奧爾文"},
            {v: "ha", n: "豪薩文"}, {v: "haw", n: "夏威夷文"}, {v: "is", n: "冰島文"}, {v: "ig", n: "伊博文"},
            {v: "jw", n: "爪哇文"}, {v: "kn", n: "坎那達文"}, {v: "kk", n: "哈薩克文"}, {v: "ku", n: "庫德文"},
            {v: "ky", n: "吉爾吉斯文"}, {v: "la", n: "拉丁文"}, {v: "lv", n: "拉脫維亞文"}, {v: "lt", n: "立陶宛文"},
            {v: "lb", n: "盧森堡文"}, {v: "mk", n: "馬其頓文"}, {v: "mg", n: "馬達加斯加文"}, {v: "ml", n: "馬拉雅拉姆文"},
            {v: "mt", n: "馬爾他文"}, {v: "mi", n: "毛利文"}, {v: "mr", n: "馬拉提文"}, {v: "mn", n: "蒙古文"},
            {v: "ne", n: "尼泊爾文"}, {v: "ps", n: "普什圖文"}, {v: "fa", n: "波斯文"}, {v: "sm", n: "薩摩亞文"},
            {v: "gd", n: "蘇格蘭蓋爾文"}, {v: "sr", n: "塞爾維亞文"}, {v: "st", n: "塞索托文"}, {v: "sn", n: "修納文"},
            {v: "sd", n: "信德文"}, {v: "si", n: "僧伽羅文"}, {v: "sk", n: "斯洛伐克文"}, {v: "sl", n: "斯洛維尼亞文"},
            {v: "so", n: "索馬利文"}, {v: "su", n: "巽他文"}, {v: "sw", n: "斯瓦希里文"}, {v: "tg", n: "塔吉克文"},
            {v: "ta", n: "坦米爾文"}, {v: "te", n: "泰盧固文"}, {v: "ur", n: "烏爾都文"}, {v: "uz", n: "烏茲別克文"},
            {v: "cy", n: "威爾斯文"}, {v: "xh", n: "科薩文"}, {v: "yi", n: "意第緒文"}, {v: "yo", n: "約魯巴文"},
            {v: "zu", n: "祖魯文"}, {v: "auto", n: "自動偵測 (Auto Detect)"}
        ];

        const srcS = document.getElementById('srcLang');
        const tarS = document.getElementById('targetLang');
        let recognition;

        function init() {
            allLangs.forEach(l => {
                srcS.add(new Option(l.n, l.v));
                if(l.v !== 'auto') tarS.add(new Option(l.n, l.v));
            });
            srcS.value = "zh-TW"; tarS.value = "ja";
            updateUI();

            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (window.SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.onresult = (e) => { 
                    document.getElementById('inputText').value = e.results[0][0].transcript;
                    runTranslate(); 
                };
                recognition.onend = () => {
                    document.getElementById('voiceBtn').classList.remove('recording-pulse');
                    document.getElementById('voiceText').innerText = "按一下 開始語音";
                };
            }
        }

        function quickSet(lang) {
            srcS.value = lang;
            tarS.value = (lang === 'zh-TW') ? 'ja' : 'zh-TW';
            updateUI();
        }

        function updateUI() {
            const sName = srcS.options[srcS.selectedIndex].text.split(' (')[0];
            document.getElementById('srcDisplay').innerText = sName;
            document.getElementById('targetDisplay').innerText = tarS.options[tarS.selectedIndex].text.split(' (')[0];
            document.getElementById('qZH').className = srcS.value === 'zh-TW' ? 'quick-btn active' : 'quick-btn';
            document.getElementById('qJA').className = srcS.value === 'ja' ? 'quick-btn active' : 'quick-btn';
            if(recognition) recognition.lang = srcS.value === 'auto' ? 'zh-TW' : srcS.value;
        }

        function swapLangs() {
            const t = srcS.value; if(t === 'auto') return;
            srcS.value = tarS.value; tarS.value = t;
            updateUI();
        }

        function toggleSpeech() {
            try { 
                recognition.start(); 
                document.getElementById('voiceBtn').classList.add('recording-pulse');
                document.getElementById('voiceText').innerText = "正在聆聽...";
            } catch(e) { recognition.stop(); }
        }

        async function runTranslate() {
            const txt = document.getElementById('inputText').value.trim();
            if(!txt) return;
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${srcS.value}&tl=${tarS.value}&dt=t&q=${encodeURIComponent(txt)}`);
                const data = await res.json();
                const result = data[0].map(i => i[0]).join('');
                document.getElementById('placeholder').classList.add('hidden');
                document.getElementById('resultContent').classList.remove('hidden');
                document.getElementById('outputText').innerText = result;
                if(window.innerWidth < 1024) document.getElementById('outputCard').scrollIntoView({behavior: 'smooth'});
            } catch(e) {}
        }

        function clearAll() { document.getElementById('inputText').value = ""; }
        function copyRes() { navigator.clipboard.writeText(document.getElementById('outputText').innerText); alert("譯文已複製"); }

        init();
    </script>
</body>
</html>
