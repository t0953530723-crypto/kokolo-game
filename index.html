<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高精準對照翻譯 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .drag-active { border: 2px dashed #4f46e5 !important; background-color: #f5f3ff !important; }
        .loading-shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <nav class="bg-white border-b px-4 py-3 sticky top-0 z-50 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">譯</div>
            <span class="font-bold text-slate-700">對照翻譯 v2.0</span>
        </div>
        <div id="status" class="text-[10px] text-slate-400 font-mono font-bold uppercase tracking-widest">Idle</div>
    </nav>

    <main class="flex-1 p-4 max-w-5xl mx-auto w-full flex flex-col gap-4">
        
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <select id="targetLang" class="bg-indigo-50 text-indigo-700 px-4 py-2 rounded-xl font-bold outline-none text-sm border-none">
                    <option value="zh-TW">轉 繁體中文</option>
                    <option value="en">轉 英文 (EN)</option>
                    <option value="ja">轉 日文 (JA)</option>
                    <option value="ko">轉 韓文 (KO)</option>
                </select>
                <span id="ocrStatus" class="text-[10px] text-slate-400 font-medium">支援拖曳圖片辨識</span>
            </div>
            
            <div class="flex gap-2">
                <label for="fileInput" class="p-2 bg-slate-100 rounded-xl cursor-pointer hover:bg-slate-200 transition-all flex items-center gap-2 text-xs font-bold text-slate-600">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    上傳圖片
                </label>
                <input type="file" id="fileInput" class="hidden" accept="image/*">
            </div>
        </div>

        <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div id="dropZone" class="bg-white rounded-3xl shadow-sm border border-slate-200 flex flex-col transition-all duration-200 overflow-hidden min-h-[300px]">
                <textarea id="inputText" class="flex-1 p-6 outline-none resize-none text-slate-800 leading-relaxed bg-transparent" placeholder="輸入文字或直接將圖片拖進這裡..."></textarea>
                <div class="p-3 border-t bg-slate-50/50 flex justify-between items-center">
                    <span id="charCount" class="text-[10px] text-slate-400 font-mono">0 CHARS</span>
                    <button onclick="clearAll()" class="text-xs text-slate-400 hover:text-red-500 font-bold">清空</button>
                </div>
            </div>

            <div id="outputCard" class="bg-white rounded-3xl shadow-sm border border-indigo-100 flex flex-col relative overflow-hidden min-h-[300px]">
                <div id="loader" class="absolute inset-0 loading-shimmer hidden z-10 opacity-60"></div>
                
                <div id="placeholder" class="flex-1 flex flex-col items-center justify-center text-slate-300 p-10 text-center">
                    <div class="w-16 h-16 mb-4 rounded-full bg-slate-50 flex items-center justify-center">
                        <svg class="w-8 h-8 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5c1.383 4.512 3.533 9.043 7.17 11.851" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    </div>
                    <p class="text-sm font-medium">翻譯結果顯示在此</p>
                </div>
                
                <div id="resultContent" class="hidden flex-1 flex flex-col p-6">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-[10px] font-black text-indigo-500 bg-indigo-50 px-3 py-1 rounded-full uppercase tracking-widest">Translated</span>
                        <button onclick="copyResult()" class="text-xs text-indigo-600 font-black hover:underline">COPY</button>
                    </div>
                    <div id="outputText" class="flex-1 text-slate-800 text-lg leading-relaxed whitespace-pre-wrap"></div>
                    <div class="mt-6 pt-4 border-t border-dashed border-slate-100">
                        <p class="text-[10px] text-slate-400 font-bold uppercase mb-2">Reference</p>
                        <p id="originalRef" class="text-xs text-slate-300 italic line-clamp-3"></p>
                    </div>
                </div>
            </div>
        </div>

        <button id="transBtn" onclick="runTranslation()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white py-5 rounded-3xl font-black text-lg shadow-xl shadow-indigo-100 transition-all active:scale-[0.98]">
            立即翻譯
        </button>
    </main>

    <script>
        const inputField = document.getElementById('inputText');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const ocrStatus = document.getElementById('ocrStatus');

        // 1. 字數即時統計
        inputField.addEventListener('input', () => {
            document.getElementById('charCount').innerText = `${inputField.value.length} CHARS`;
        });

        // 2. 拖曳功能實作
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-active'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('drag-active'), false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files[0]);
        }, false);

        fileInput.addEventListener('change', (e) => handleFiles(e.target.files[0]));

        // 3. 處理 OCR 辨識
        async function handleFiles(file) {
            if (!file || !file.type.startsWith('image/')) return;

            ocrStatus.innerText = "⏳ 正在辨識圖片文字...";
            ocrStatus.className = "text-[10px] text-indigo-500 font-bold animate-pulse";
            
            try {
                const worker = await Tesseract.createWorker('chi_tra+eng');
                const { data: { text } } = await worker.recognize(file);
                await worker.terminate();

                inputField.value = text;
                document.getElementById('charCount').innerText = `${text.length} CHARS`;
                ocrStatus.innerText = "✅ 辨識成功！";
                ocrStatus.className = "text-[10px] text-green-500 font-bold";
            } catch (err) {
                ocrStatus.innerText = "❌ 辨識出錯";
                ocrStatus.className = "text-[10px] text-red-500 font-bold";
            }
        }

        // 4. 翻譯邏輯 (備援版)
        async function runTranslation() {
            const text = inputField.value.trim();
            const target = document.getElementById('targetLang').value;
            const btn = document.getElementById('transBtn');
            const loader = document.getElementById('loader');
            const statusTag = document.getElementById('status');

            if (!text) return;

            btn.disabled = true;
            loader.classList.remove('hidden');
            statusTag.innerText = "Translating...";

            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${target}&dt=t&q=${encodeURIComponent(text)}`;
                const res = await fetch(url);
                const data = await res.json();
                const translated = data[0].map(item => item[0]).join('');
                
                document.getElementById('placeholder').classList.add('hidden');
                document.getElementById('resultContent').classList.remove('hidden');
                document.getElementById('outputText').innerText = translated;
                document.getElementById('originalRef').innerText = text;
                statusTag.innerText = "Success";
                
                if (window.innerWidth < 768) {
                    document.getElementById('outputCard').scrollIntoView({ behavior: 'smooth' });
                }
            } catch (err) {
                statusTag.innerText = "Error";
                alert("網路異常，請稍後再試。");
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        }

        function clearAll() {
            inputField.value = "";
            document.getElementById('resultContent').classList.add('hidden');
            document.getElementById('placeholder').classList.remove('hidden');
            ocrStatus.innerText = "支援拖曳圖片辨識";
            ocrStatus.className = "text-[10px] text-slate-400";
        }

        function copyResult() {
            navigator.clipboard.writeText(document.getElementById('outputText').innerText);
            alert("譯文已複製");
        }
    </script>
</body>
</html>
