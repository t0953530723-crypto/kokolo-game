<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 語音文字翻譯對照</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; background: #f9fafb; font-family: sans-serif; }
        .editor-container { background: #ffffff; border: 2px solid #e5e7eb; border-radius: 1.5rem; transition: all 0.2s; }
        .big-touch-area { 
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            height: 70px;
            padding: 0 1.5rem;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 1.25rem;
            cursor: pointer;
        }
        .lang-select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 10; }
        textarea { font-size: 18px !important; resize: none; color: #1e293b; border: none; outline: none; width: 100%; padding: 1.5rem; }
        .recording-pulse { animation: pulse 1.5s infinite; background-color: #ef4444 !important; color: white !important; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="bg-white border-b px-6 py-4 sticky top-0 z-50 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <div class="bg-blue-600 text-white p-1.5 rounded-lg font-black text-xl">譯</div>
            <h1 class="font-bold text-slate-800">語音文字對照</h1>
        </div>
        <div id="status" class="text-[10px] font-black text-blue-500 bg-blue-50 px-2 py-1 rounded">VOICE READY</div>
    </nav>

    <main class="flex-1 p-4 lg:p-8 max-w-7xl mx-auto w-full flex flex-col gap-6">
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 items-center relative">
            <div class="big-touch-area shadow-sm">
                <div class="flex flex-col">
                    <span class="text-[10px] font-black text-slate-400 uppercase">From</span>
                    <span id="srcDisplay" class="font-bold text-slate-700">繁體中文</span>
                </div>
                <select id="srcLang" class="lang-select" onchange="updateLangs()"></select>
                <div class="ml-auto text-slate-300">▼</div>
            </div>

            <button onclick="swapLangs()" class="lg:absolute lg:left-1/2 lg:-translate-x-1/2 z-20 bg-slate-900 text-white w-12 h-12 rounded-full shadow-lg flex items-center justify-center active:scale-90 transition-all mx-auto -my-2 lg:my-0 border-4 border-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
            </button>

            <div class="big-touch-area shadow-sm">
                <div class="flex flex-col">
                    <span class="text-[10px] font-black text-blue-400 uppercase">To</span>
                    <span id="targetDisplay" class="font-bold text-blue-600">繁體中文</span>
                </div>
                <select id="targetLang" class="lang-select" onchange="updateLangs()"></select>
                <div class="ml-auto text-blue-300">▼</div>
            </div>
        </div>

        <div class="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="editor-container flex flex-col min-h-[300px] shadow-sm">
                <textarea id="inputText" class="flex-1 rounded-t-[1.5rem]" placeholder="請輸入文字或點擊下方語音按鈕..."></textarea>
                
                <div class="p-3 bg-slate-50 border-t flex gap-3">
                    <button id="voiceBtn" onclick="toggleSpeech()" class="flex-[2] py-4 bg-white border-2 border-blue-100 rounded-2xl flex items-center justify-center gap-3 hover:bg-blue-50 transition-all active:scale-[0.98]">
                        <div id="micIcon" class="w-3 h-3 bg-blue-600 rounded-full"></div>
                        <span id="voiceBtnText" class="font-black text-blue-600">語音辨識</span>
                    </button>
                    <button onclick="clearAll()" class="flex-1 bg-slate-200 text-slate-500 font-bold rounded-2xl">清空</button>
                </div>
            </div>

            <div id="outputCard" class="editor-container flex flex-col relative min-h-[300px] bg-blue-50/5 border-blue-50 overflow-hidden">
                <div id="resultContent" class="hidden flex-1 flex flex-col p-8">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-[10px] font-black text-blue-600 bg-blue-100 px-2 py-0.5 rounded uppercase">Translation</span>
                        <button onclick="copyRes()" class="text-xs font-bold text-blue-600 hover:underline">複製</button>
                    </div>
                    <div id="outputText" class="text-slate-800 text-xl font-medium leading-relaxed whitespace-pre-wrap"></div>
                </div>
                <div id="placeholder" class="flex-1 flex items-center justify-center text-slate-300 italic text-sm">譯文將在此對照顯示</div>
            </div>
        </div>

        <button id="transBtn" onclick="runTranslate()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-6 rounded-3xl font-black text-xl shadow-xl active:scale-[0.98] transition-all">
            立即翻譯
        </button>

    </main>

    <script>
        const langs = [
            {v: "auto", n: "自動偵測 (Detect)"},
            {v: "zh-TW", n: "繁體中文"},
            {v: "zh-CN", n: "簡體中文"},
            {v: "en", n: "英文 (English)"},
            {v: "ja", n: "日文 (Japanese)"},
            {v: "ko", n: "韓文 (Korean)"},
            {v: "th", n: "泰文 (Thai)"},
            {v: "vi", n: "越南文 (Vietnamese)"}
        ];

        const srcS = document.getElementById('srcLang');
        const tarS = document.getElementById('targetLang');
        let recognition;

        function setup() {
            langs.forEach(l => {
                srcS.add(new Option(l.n, l.v));
                if(l.v !== 'auto') tarS.add(new Option(l.n, l.v));
            });
            srcS.value = "zh-TW";
            tarS.value = "zh-TW";
            updateLangs();

            // 初始化語音辨識
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (window.SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'zh-TW'; // 預設跟隨來源語言，此處設定初始

                recognition.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    document.getElementById('inputText').value += text;
                    stopSpeechUI();
                };

                recognition.onerror = () => stopSpeechUI();
                recognition.onend = () => stopSpeechUI();
            } else {
                document.getElementById('voiceBtn').style.display = 'none';
            }
        }

        function updateLangs() {
            document.getElementById('srcDisplay').innerText = srcS.options[srcS.selectedIndex].text;
            document.getElementById('targetDisplay').innerText = tarS.options[tarS.selectedIndex].text;
            if(recognition) recognition.lang = srcS.value === 'auto' ? 'zh-TW' : srcS.value;
        }

        function toggleSpeech() {
            const btn = document.getElementById('voiceBtn');
            const text = document.getElementById('voiceBtnText');
            
            if (btn.classList.contains('recording-pulse')) {
                recognition.stop();
            } else {
                recognition.start();
                btn.classList.add('recording-pulse');
                text.innerText = "聆聽中...";
                document.getElementById('micIcon').classList.replace('bg-blue-600', 'bg-white');
            }
        }

        function stopSpeechUI() {
            const btn = document.getElementById('voiceBtn');
            btn.classList.remove('recording-pulse');
            document.getElementById('voiceBtnText').innerText = "語音辨識";
            document.getElementById('micIcon').classList.replace('bg-white', 'bg-blue-600');
        }

        function swapLangs() {
            if(srcS.value === 'auto') return;
            const t = srcS.value;
            srcS.value = tarS.value;
            tarS.value = t;
            updateLangs();
        }

        async function runTranslate() {
            const txt = document.getElementById('inputText').value.trim();
            if(!txt) return;
            const btn = document.getElementById('transBtn');
            btn.disabled = true;

            try {
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${srcS.value}&tl=${tarS.value}&dt=t&q=${encodeURIComponent(txt)}`;
                const res = await fetch(url);
                const data = await res.json();
                const result = data[0].map(i => i[0]).join('');

                document.getElementById('placeholder').classList.add('hidden');
                document.getElementById('resultContent').classList.remove('hidden');
                document.getElementById('outputText').innerText = result;

                if(window.innerWidth < 1024) document.getElementById('outputCard').scrollIntoView({behavior: 'smooth'});
            } catch (e) {
                alert("翻譯引擎連線失敗");
            } finally {
                btn.disabled = false;
            }
        }

        function clearAll() {
            document.getElementById('inputText').value = "";
            document.getElementById('resultContent').classList.add('hidden');
            document.getElementById('placeholder').classList.remove('hidden');
        }

        function copyRes() {
            navigator.clipboard.writeText(document.getElementById('outputText').innerText);
            alert("已複製譯文");
        }

        setup();
    </script>
</body>
</html>
